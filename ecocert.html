<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECOCERT — Data pensione</title>

<style>
- { box-sizing: border-box; }
body {
  margin: 0;
  background: #eef3f6;
  color: #203447;
  font-family: system-ui, sans-serif;
  line-height: 1.45;
}
main {
  max-width: 480px;
  margin: auto;
  padding: 20px 14px 32px;
}
h1 { font-size: 26px; margin: 0 0 6px; }
header p { margin: 0; color: #617384; font-size: 14px; }
.card {
  background: white;
  border: 1px solid #dce5ec;
  border-radius: 16px;
  padding: 20px;
  margin-top: 18px;
}
label {
  display: block;
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 16px;
}
label:last-of-type { margin-bottom: 0; }
input, select {
  display: block;
  width: 100%;
  min-width: 0;
  margin-top: 7px;
  padding: 12px;
  border: 1px solid #a3b3bf;
  border-radius: 9px;
  background: white;
  color: #203447;
  font: inherit;
  font-size: 16px;
}
input:focus, select:focus, .info-btn:focus-visible, .modal-close:focus-visible {
  outline: 3px solid #a9dbdd;
  outline-offset: 2px;
}
.hero {
  background: #e3f4ef;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 10px;
}
.hero span { font-size: 13px; color: #285e50; }
.hero strong {
  display: block;
  font-size: 32px;
  color: #075b49;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.hero-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.hero-row strong { margin-top: 0; }
.calc-title {
  display: block;
  font-size: 13px;
  font-weight: 650;
  color: #617384;
  margin: 4px 0 6px;
}
.step { padding: 14px 0; border-bottom: 1px solid #e6edf1; }
.step:last-child { border-bottom: 0; }
.step.step-highlight {
  background: #fff8e1;
  border-radius: 10px;
  padding: 14px 12px;
  border-bottom-color: transparent;
}
.step-title { display: block; font-size: 13px; color: #617384; }
.step-value {
  display: block;
  font-size: 19px;
  font-weight: 650;
  margin-top: 3px;
}
.step small {
  display: block;
  color: #617384;
  font-size: 12px;
  margin-top: 3px;
}
.info-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  margin-top: 0;
  padding: 8px 14px;
  border: 1px solid #a3b3bf;
  border-radius: 999px;
  background: #f5f8fa;
  color: #203447;
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.info-btn:hover { background: #e6edf1; }
.info-btn:active { background: #dce5ec; }
#error { color: #9c2232; font-size: 14px; margin: 12px 0 0; }
#error:empty { display: none; }
.warning {
  background: #fff4dc;
  color: #74511c;
  padding: 12px;
  border-radius: 9px;
  font-size: 12px;
  margin-top: 14px;
}

/* --- Popup --- */
body.modal-open { overflow: hidden; }
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(20, 35, 47, .55);
}
.modal-panel {
  position: relative;
  width: 100%;
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 18px 40px rgba(20, 35, 47, .28);
}
.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.modal-head h2 { font-size: 18px; margin: 0; }
.modal-close {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid #dce5ec;
  border-radius: 50%;
  background: #f5f8fa;
  color: #203447;
  font: inherit;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-close:hover { background: #e6edf1; }
.modal-text { font-size: 14px; color: #3b4f60; margin: 10px 0 0; }
.table-wrap {
  margin-top: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.modal-table th {
  background: #203447;
  color: #fff;
  padding: 8px 7px;
  text-align: right;
  font-weight: 650;
  white-space: nowrap;
}
.modal-table td {
  padding: 8px 7px;
  text-align: right;
  border-bottom: 1px solid #e1e8ee;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.modal-table th:first-child,
.modal-table td:first-child { text-align: left; }
.modal-table tbody tr:nth-child(even) { background: #f5f8fa; }
.modal-table tr.is-current { background: #e3f4ef; font-weight: 700; }

.modal-table.calendar-table td:nth-child(2),
.modal-table.calendar-table th:nth-child(2) { text-align: center; }
.modal-table.calendar-table tr.cal-row-input { background: #fde8e8; font-weight: 650; }
.modal-table.calendar-table tr.cal-row-total { background: #d8efe6; font-weight: 700; }
.modal-table.calendar-table tr.cal-row-empty { color: #9aa9b5; }
.modal-table.calendar-table td.col-mesi { font-weight: 650; }

.modal-note { color: #617384; font-size: 12px; margin: 12px 0 0; }

/* Stile per gli input dentro il popup */
.cal-inputs {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #e1e8ee;
}
.cal-inputs label {
  margin-bottom: 12px;
}
.cal-inputs label:last-of-type {
  margin-bottom: 0;
}
#modal-calendar-error { margin-top: 14px; margin-bottom: 0; }

[hidden] { display: none !important; }
@media (max-width: 350px) {
  .card { padding: 15px; }
  .hero strong { font-size: 28px; }
  .modal { padding: 10px; }
  .modal-panel { padding: 15px; }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>Data pensione anticipata</h1>
    <p>Calcolo dinamico da ECOCERT</p>
  </header>

  <section class="card" aria-label="Dati ECOCERT">
    <label for="weeks">
      Settimane / marchette ECOCERT
      <input id="weeks" type="number" min="0" step="1"
             value="2000" inputmode="numeric" required>
    </label>

    <label for="reference">
      Data di riferimento ECOCERT
      <input id="reference" type="date"
             value="2026-05-30" required>
    </label>

    <label for="sex">
      Sesso
      <select id="sex">
        <option value="U">U — Uomo</option>
        <option value="D">D — Donna</option>
      </select>
    </label>

    <p id="error" role="alert"></p>
  </section>

  <section id="result" class="card"
           aria-live="polite" aria-atomic="true" hidden>
    <div class="hero">
      <span>Data pensione anticipata — arrotondata</span>
      <div class="hero-row">
        <strong id="retirement"></strong>
        <button id="btn-calendar" type="button" class="info-btn"
                aria-haspopup="dialog" aria-controls="modal-calendar">
          📅 Calendario periodi
        </button>
      </div>
    </div>

    <span class="calc-title">calcolo della data:</span>
    <div id="steps"></div>
    <!-- L'elemento #warning rimane ma non verrà più popolato da quel messaggio -->
    <p id="warning" class="warning" hidden></p>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true"
       aria-labelledby="modal-title" aria-describedby="modal-text">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button id="modal-close" type="button" class="modal-close"
              data-close aria-label="Chiudi">✕</button>
    </div>
    <p id="modal-text" class="modal-text"></p>
    <div class="table-wrap">
      <table class="modal-table">
        <thead>
          <tr>
            <th scope="col">Anno</th>
            <th scope="col">Requisito</th>
            <th scope="col">Settimane</th>
            <th scope="col">Incremento</th>
          </tr>
        </thead>
        <tbody id="modal-table-body"></tbody>
      </table>
    </div>
    <p class="modal-note">Riga evidenziata: anno in cui cade la data base.</p>
  </div>
</div>

<div id="modal-calendar" class="modal" hidden>
  <div class="modal-backdrop" data-close-calendar></div>
  <div class="modal-panel" role="dialog" aria-modal="true"
       aria-labelledby="modal-calendar-title">
    <div class="modal-head">
      <h2 id="modal-calendar-title">Calendario periodi</h2>
      <button id="modal-calendar-close" type="button" class="modal-close"
              data-close-calendar aria-label="Chiudi">✕</button>
    </div>
    
    <p id="modal-calendar-summary" class="modal-text"></p>
    
    <div class="cal-inputs">
      <label for="data-uscita">
        Ultimo giorno in azienda
        <input id="data-uscita" type="date" value="2026-12-31" required>
      </label>
      <label for="mesi-preavviso">
        Preavviso pagato (mesi)
        <input id="mesi-preavviso" type="number" min="0" step="1"
               value="4" inputmode="numeric" required>
      </label>
    </div>

    <p id="modal-calendar-error" class="warning" hidden></p>

    <div class="table-wrap">
      <table class="modal-table calendar-table">
        <thead>
          <tr>
            <th scope="col">Periodo</th>
            <th scope="col">Mesi</th>
            <th scope="col">Da</th>
            <th scope="col">A</th>
          </tr>
        </thead>
        <tbody id="modal-calendar-body"></tbody>
      </table>
    </div>
    <p id="modal-calendar-warning" class="modal-note" hidden></p>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   PARTE 1 — Motore A: calcolo data pensione
   ========================================================= */

const TABELLA_REQUISITI = [
  { anno: 2026, U: { testo: "42 anni e 10 mesi", marche: 2227 }, D: { testo: "41 anni e 10 mesi", marche: 2175 } },
  { anno: 2027, U: { testo: "42 anni e 11 mesi", marche: 2231 }, D: { testo: "41 anni e 11 mesi", marche: 2179 } },
  { anno: 2028, U: { testo: "43 anni e 1 mese",  marche: 2240 }, D: { testo: "42 anni e 1 mese",  marche: 2188 } },
  { anno: 2029, U: { testo: "43 anni e 4 mesi",  marche: 2253 }, D: { testo: "42 anni e 4 mesi",  marche: 2201 } },
  { anno: 2030, U: { testo: "43 anni e 4 mesi",  marche: 2253 }, D: { testo: "42 anni e 4 mesi",  marche: 2201 } },
  { anno: 2031, U: { testo: "43 anni e 6 mesi",  marche: 2262 }, D: { testo: "42 anni e 6 mesi",  marche: 2210 } },
  { anno: 2032, U: { testo: "43 anni e 6 mesi",  marche: 2262 }, D: { testo: "42 anni e 6 mesi",  marche: 2210 } },
  { anno: 2033, U: { testo: "43 anni e 7 mesi",  marche: 2266 }, D: { testo: "42 anni e 7 mesi",  marche: 2214 } },
  { anno: 2034, U: { testo: "43 anni e 7 mesi",  marche: 2266 }, D: { testo: "42 anni e 7 mesi",  marche: 2214 } }
];

const ANNO_BASE = 2026;
const RIGA_BASE = TABELLA_REQUISITI.find(r => r.anno === ANNO_BASE);
const BASE = { U: RIGA_BASE.U.marche, D: RIGA_BASE.D.marche };
const INCREMENTI = {};
for (const riga of TABELLA_REQUISITI) {
  INCREMENTI[riga.anno] = {
    U: riga.U.marche - BASE.U,
    D: riga.D.marche - BASE.D
  };
}

const GIORNO = 86400000;
const FINESTRA_MESI = 3;

const $ = id => document.getElementById(id);
const numero = n => n.toLocaleString("it-IT");

function dataIt(data) {
  const giorno = String(data.getUTCDate()).padStart(2, "0");
  const mese = String(data.getUTCMonth() + 1).padStart(2, "0");
  return `${giorno}/${mese}/${data.getUTCFullYear()}`;
}

function aggiungiSettimane(data, settimane) {
  return new Date(data.getTime() + settimane * 7 * GIORNO);
}

function aggiungiMesi(data, mesi) {
  const risultato = new Date(data.getTime());
  const giornoOriginale = risultato.getUTCDate();
  risultato.setUTCDate(1);
  risultato.setUTCMonth(risultato.getUTCMonth() + mesi);
  const ultimoGiorno = new Date(risultato.getTime());
  ultimoGiorno.setUTCMonth(ultimoGiorno.getUTCMonth() + 1);
  ultimoGiorno.setUTCDate(0);
  risultato.setUTCDate(Math.min(giornoOriginale, ultimoGiorno.getUTCDate()));
  return risultato;
}

function primoGiornoMeseSuccessivo(data) {
  const risultato = new Date(data.getTime());
  risultato.setUTCDate(1);
  risultato.setUTCMonth(risultato.getUTCMonth() + 1);
  return risultato;
}

function calcola(settimane, riferimento, sesso) {
  if (!Number.isSafeInteger(settimane) || settimane < 0) {
    throw new Error("Inserisci un numero intero non negativo di settimane.");
  }
  if (!Object.prototype.hasOwnProperty.call(BASE, sesso)) {
    throw new Error("Seleziona U oppure D.");
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(riferimento)) {
    throw new Error("Inserisci una data valida.");
  }
  const dataEcocert = new Date(riferimento + "T00:00:00.000Z");
  if (!Number.isFinite(dataEcocert.getTime()) ||
      dataEcocert.toISOString().slice(0, 10) !== riferimento) {
    throw new Error("Inserisci una data valida.");
  }
  const requisito = BASE[sesso];
  const mancanti = requisito - settimane;
  if (mancanti < 0) {
    throw new Error("Requisito base già superato: occorre verificare separatamente la data storica di maturazione.");
  }
  const dataBase = aggiungiSettimane(dataEcocert, mancanti);
  const anno = dataBase.getUTCFullYear();
  if (!Object.prototype.hasOwnProperty.call(INCREMENTI, anno)) {
    throw new Error(`La data base cade nel ${anno}: anno fuori dalla tabella 2026–2034.`);
  }
  const incremento = INCREMENTI[anno][sesso];
  const dataAspettativa = aggiungiSettimane(dataBase, incremento);
  const dataAspettativaArrotondata = primoGiornoMeseSuccessivo(dataAspettativa);
  const dataFinestra = aggiungiMesi(dataAspettativaArrotondata, FINESTRA_MESI);
  const dataPensione = dataFinestra;
  return { dataEcocert, requisito, mancanti, dataBase, anno,
           incremento, dataAspettativa, dataAspettativaArrotondata,
           dataFinestra, dataPensione };
}

/* =========================================================
   PARTE 2 — Motore B: calendario periodi
   ========================================================= */

function parseDataInput(valore) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(valore || "")) return null;
  const d = new Date(valore + "T00:00:00.000Z");
  if (!Number.isFinite(d.getTime())) return null;
  if (d.toISOString().slice(0, 10) !== valore) return null;
  return d;
}

function mesiTra(inizio, fine) {
  return (fine.getUTCFullYear() - inizio.getUTCFullYear()) * 12
       + (fine.getUTCMonth() - inizio.getUTCMonth()) + 1;
}

function calcolaCalendarioPeriodi(dataUscita, mesiPreavviso, dataPensione) {
  const MESI_FINESTRA = 3;
  const MESI_ANNO = 12;

  if (!(dataUscita instanceof Date) || isNaN(dataUscita.getTime())) {
    throw new Error("Inserisci una data valida per l'ultimo giorno in azienda.");
  }
  if (!Number.isSafeInteger(mesiPreavviso) || mesiPreavviso < 0) {
    throw new Error("Inserisci un numero intero non negativo di mesi di preavviso.");
  }
  if (!(dataPensione instanceof Date) || isNaN(dataPensione.getTime())) {
    throw new Error("Data pensione non disponibile.");
  }

  const inizioFinestra = aggiungiMesi(dataPensione, -MESI_FINESTRA);
  const fineIncentivi = new Date(inizioFinestra.getTime() - GIORNO);
  
  let cursore = new Date(dataUscita.getTime() + GIORNO);
  
  if (cursore > inizioFinestra) {
    throw new Error("La data di uscita è troppo vicina alla pensione per rispettare i 3 mesi di finestra.");
  }

  const periodi = [];
  let warning = null;

  function pushPeriodo(nome, mesiDaAggiungere, limiteFine = null) {
    let fineTeorica = new Date(aggiungiMesi(cursore, mesiDaAggiungere).getTime() - GIORNO);
    let fineEffettiva = (limiteFine && fineTeorica > limiteFine) ? limiteFine : fineTeorica;
    
    if (cursore > fineEffettiva) {
        periodi.push({ nome, da: null, a: null, mesi: 0 });
        return;
    }
    
    const mesi = mesiTra(cursore, fineEffettiva);
    periodi.push({
      nome,
      da: new Date(cursore.getTime()),
      a: new Date(fineEffettiva.getTime()),
      mesi
    });
    cursore = new Date(fineEffettiva.getTime() + GIORNO);
  }

  pushPeriodo("Preavviso pagato", mesiPreavviso, fineIncentivi);
  pushPeriodo("Anno 1 - NASpI", MESI_ANNO, fineIncentivi);
  pushPeriodo("Anno 2 - NASpI", MESI_ANNO, fineIncentivi);

  let mesiRimanenti = 0;
  if (cursore <= fineIncentivi) {
      mesiRimanenti = mesiTra(cursore, fineIncentivi);
  }
  
  if (mesiRimanenti > 24) {
      warning = "La distanza tra la fine della NASpI e la finestra supera i 24 mesi. " +
                "Lo schema prevede al massimo 24 mesi di incentivo (12+12).";
  }

  let mesiAnno3 = Math.min(12, mesiRimanenti);
  pushPeriodo("Anno 3 - incentivo", mesiAnno3, fineIncentivi);

  let mesiAnno4 = Math.max(0, mesiRimanenti - 12);
  pushPeriodo("Anno 4 - incentivo", mesiAnno4, fineIncentivi);

  const mesiFinestra = mesiTra(inizioFinestra, new Date(dataPensione.getTime() - GIORNO));
  periodi.push({
      nome: "Finestra uscita",
      da: new Date(inizioFinestra.getTime()),
      a: new Date(dataPensione.getTime() - GIORNO),
      mesi: mesiFinestra
  });

  const gapMesi = periodi.reduce((acc, p) => acc + p.mesi, 0);

  return { periodi, gapMesi, inizioPensione: dataPensione, warning };
}

/* =========================================================
   PARTE 3 — Rendering
   ========================================================= */

let ultimoRisultato = null;

function aggiungiPassaggio(titolo, valore, operazione, extra, classeExtra) {
  const div = document.createElement("div");
  div.className = classeExtra ? `step ${classeExtra}` : "step";
  const label = document.createElement("span");
  label.className = "step-title";
  label.textContent = titolo;
  const risultato = document.createElement("span");
  risultato.className = "step-value";
  risultato.textContent = valore;
  div.append(label, risultato);
  if (operazione) {
    const dettaglio = document.createElement("small");
    dettaglio.textContent = operazione;
    div.append(dettaglio);
  }
  if (extra) div.append(extra);
  $("steps").append(div);
}

function aggiorna() {
  chiudiModal();
  chiudiCalendario();

  $("error").textContent = "";
  $("result").hidden = true;
  $("steps").replaceChildren();
  $("warning").hidden = true;
  ultimoRisultato = null;

  try {
    const input = $("weeks").value.trim();
    const settimane = input === "" ? NaN : Number(input);
    const sesso = $("sex").value;

    const r = calcola(settimane, $("reference").value, sesso);
    ultimoRisultato = r;

    $("retirement").textContent = dataIt(r.dataPensione);

    aggiungiPassaggio("1 · Requisito base 2026", numero(r.requisito) + " settimane", sesso === "U" ? "Uomo" : "Donna");
    aggiungiPassaggio("2 · Settimane mancanti", numero(r.mancanti) + " settimane", `=${numero(r.requisito)} − ${numero(settimane)}`);
    aggiungiPassaggio("3 · Data base senza aspettativa di vita", dataIt(r.dataBase), `=${dataIt(r.dataEcocert)} + ${r.mancanti} × 7 giorni`);

    const pulsanteInfo = document.createElement("button");
    pulsanteInfo.type = "button";
    pulsanteInfo.className = "info-btn";
    pulsanteInfo.setAttribute("aria-haspopup", "dialog");
    pulsanteInfo.setAttribute("aria-controls", "modal");
    pulsanteInfo.textContent = "Tabella incrementi aspettative di vita";
    pulsanteInfo.addEventListener("click", () => apriModal(r.anno, sesso, pulsanteInfo));

    aggiungiPassaggio(`4 · Aspettativa di vita · anno ${r.anno}`, "+" + r.incremento + " settimane",
                      "Incremento scelto sull'anno della data base", pulsanteInfo);
    aggiungiPassaggio("5 · Data + aspettativa di vita", dataIt(r.dataAspettativa), `=${dataIt(r.dataBase)} + ${r.incremento} × 7 giorni`);
    aggiungiPassaggio("6 · Data con aspettativa di vita arrotondata (incentivo)", dataIt(r.dataAspettativaArrotondata), "Primo giorno del mese successivo", null, "step-highlight");
    aggiungiPassaggio("7 · Finestra", FINESTRA_MESI + " mesi", "Mesi di calendario, non settimane");
    aggiungiPassaggio("8 · Data pensione anticipata", dataIt(r.dataPensione), `=${dataIt(r.dataAspettativaArrotondata)} + ${FINESTRA_MESI} mesi`, null, "step-highlight");

    // L'avviso testuale alla fine della schermata è stato rimosso.

    $("result").hidden = false;
  } catch (errore) {
    $("error").textContent = errore.message;
  }
}

/* =========================================================
   PARTE 4 — Modale incrementi
   ========================================================= */

let focusPrecedente = null;

function apriModal(anno, sesso, origine) {
  const riga = TABELLA_REQUISITI.find(r => r.anno === anno);
  const dati = riga[sesso];
  const base = BASE[sesso];
  const incremento = INCREMENTI[anno][sesso];
  const soggetto = sesso === "U" ? "gli uomini" : "le donne";

  $("modal-title").textContent = `Aspettativa di vita · anno ${anno}`;
  $("modal-text").textContent =
    `La data base (punto 3) cade nel ${anno}. ` +
    `Per ${soggetto} il requisito del ${anno} è di ` +
    `${numero(dati.marche)} settimane (${dati.testo}), cioè ` +
    `${numero(incremento)} settimane in più rispetto al requisito base ` +
    `del ${ANNO_BASE} (${numero(base)} settimane). ` +
    `Per questo il punto 4 aggiunge ${numero(incremento)} settimane.`;

  const corpo = $("modal-table-body");
  corpo.replaceChildren();

  for (const r of TABELLA_REQUISITI) {
    const valori = r[sesso];
    const tr = document.createElement("tr");
    if (r.anno === anno) {
      tr.className = "is-current";
      tr.setAttribute("aria-current", "true");
    }
    const celle = [
      String(r.anno),
      valori.testo,
      numero(valori.marche),
      "+" + numero(valori.marche - base)
    ];
    for (const testo of celle) {
      const td = document.createElement("td");
      td.textContent = testo;
      tr.append(td);
    }
    corpo.append(tr);
  }

  focusPrecedente = origine || null;
  $("modal").hidden = false;
  document.body.classList.add("modal-open");
  $("modal-close").focus();
}

function chiudiModal() {
  if ($("modal").hidden) return;
  $("modal").hidden = true;
  if ($("modal-calendar").hidden) document.body.classList.remove("modal-open");
  if (focusPrecedente && document.contains(focusPrecedente)) focusPrecedente.focus();
  focusPrecedente = null;
}

/* =========================================================
   PARTE 5 — Modale calendario
   ========================================================= */

let focusCalendario = null;

function formatMesiTotali(mesi) {
  const anni = Math.floor(mesi / 12);
  const resto = mesi % 12;
  const parti = [];
  if (anni > 0) parti.push(anni + (anni === 1 ? " anno" : " anni"));
  if (resto > 0) parti.push(resto + (resto === 1 ? " mese" : " mesi"));
  return parti.length ? parti.join(" e ") : "0 mesi";
}

function apriCalendario(origine) {
  if (!ultimoRisultato) return; 

  if ($("modal-calendar").hidden) {
    focusCalendario = origine || null;
    $("modal-calendar").hidden = false;
    document.body.classList.add("modal-open");
    if (origine) $("modal-calendar-close").focus();
  }

  const dataUscita = parseDataInput($("data-uscita").value);
  const preavvisoRaw = $("mesi-preavviso").value.trim();
  const mesiPreavviso = preavvisoRaw === "" ? NaN : Number(preavvisoRaw);

  try {
    const r = calcolaCalendarioPeriodi(
      dataUscita, mesiPreavviso, ultimoRisultato.dataPensione
    );
    
    $("modal-calendar-error").hidden = true;

    const corpo = $("modal-calendar-body");
    corpo.replaceChildren();

    {
      const tr = document.createElement("tr");
      tr.className = "cal-row-input";
      const td0 = document.createElement("td");
      td0.textContent = "Ultimo giorno in azienda";
      const td1 = document.createElement("td");
      td1.textContent = "";
      const td2 = document.createElement("td");
      td2.textContent = "";
      const td3 = document.createElement("td");
      td3.textContent = dataIt(dataUscita);
      tr.append(td0, td1, td2, td3);
      corpo.append(tr);
    }

    for (const p of r.periodi) {
      const tr = document.createElement("tr");
      if (p.mesi === 0) tr.className = "cal-row-empty";

      const tdNome = document.createElement("td");
      tdNome.textContent = p.nome;

      const tdMesi = document.createElement("td");
      tdMesi.className = "col-mesi";
      tdMesi.textContent = String(p.mesi);

      const tdDa = document.createElement("td");
      tdDa.textContent = p.da ? dataIt(p.da) : "—";

      const tdA = document.createElement("td");
      tdA.textContent = p.a ? dataIt(p.a) : "—";

      tr.append(tdNome, tdMesi, tdDa, tdA);
      corpo.append(tr);
    }

    {
      const tr = document.createElement("tr");
      tr.className = "cal-row-total";
      const td0 = document.createElement("td");
      td0.textContent = "Inizio pensione";
      const td1 = document.createElement("td");
      td1.className = "col-mesi";
      td1.textContent = String(r.gapMesi);
      const td2 = document.createElement("td");
      td2.textContent = "";
      const td3 = document.createElement("td");
      td3.textContent = dataIt(r.inizioPensione);
      tr.append(td0, td1, td2, td3);
      corpo.append(tr);
    }

    $("modal-calendar-summary").textContent =
      `Mancano in totale: ${formatMesiTotali(r.gapMesi)} (${r.gapMesi} mesi).`;

    if (r.warning) {
      $("modal-calendar-warning").hidden = false;
      $("modal-calendar-warning").textContent = "⚠ " + r.warning;
    } else {
      $("modal-calendar-warning").hidden = true;
      $("modal-calendar-warning").textContent = "";
    }

  } catch (e) {
    $("modal-calendar-error").hidden = false;
    $("modal-calendar-error").textContent = e.message;
    $("modal-calendar-body").replaceChildren();
    $("modal-calendar-summary").textContent = "";
    $("modal-calendar-warning").hidden = true;
  }
}

function chiudiCalendario() {
  if ($("modal-calendar").hidden) return;
  $("modal-calendar").hidden = true;
  if ($("modal").hidden) document.body.classList.remove("modal-open");
  if (focusCalendario && document.contains(focusCalendario)) focusCalendario.focus();
  focusCalendario = null;
}

/* =========================================================
   PARTE 6 — Gestione eventi
   ========================================================= */

$("modal").addEventListener("click", evento => {
  if (evento.target.closest("[data-close]")) chiudiModal();
});

$("modal-calendar").addEventListener("click", evento => {
  if (evento.target.closest("[data-close-calendar]")) chiudiCalendario();
});

document.addEventListener("keydown", evento => {
  const calendarioAperto = !$("modal-calendar").hidden;
  const incrementiAperto = !$("modal").hidden;
  if (!calendarioAperto && !incrementiAperto) return;

  const modale = calendarioAperto ? $("modal-calendar") : $("modal");

  if (evento.key === "Escape") {
    evento.preventDefault();
    if (calendarioAperto) chiudiCalendario();
    else chiudiModal();
    return;
  }

  if (evento.key === "Tab") {
    const focusabili = modale.querySelectorAll(
      'button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    if (focusabili.length === 0) return;
    const primo = focusabili[0];
    const ultimo = focusabili[focusabili.length - 1];
    if (evento.shiftKey && document.activeElement === primo) {
      evento.preventDefault();
      ultimo.focus();
    } else if (!evento.shiftKey && document.activeElement === ultimo) {
      evento.preventDefault();
      primo.focus();
    }
  }
});

$("btn-calendar").addEventListener("click", evento => {
  apriCalendario(evento.currentTarget);
});

$("weeks").addEventListener("input", aggiorna);
$("reference").addEventListener("input", aggiorna);
$("sex").addEventListener("change", aggiorna);

$("data-uscita").addEventListener("input", () => {
  if (!$("modal-calendar").hidden) apriCalendario();
});
$("mesi-preavviso").addEventListener("input", () => {
  if (!$("modal-calendar").hidden) apriCalendario();
});

aggiorna();
</script>
